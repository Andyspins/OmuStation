- type: entity
  id: SecretDoublePlusMid
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretDoublePlus
    minStartingChaos: 8
    maxStartingChaos: 16
    chaosChangeVariationMin: 0.65
    chaosChangeVariationMax: 1.3
    eventIntervalMin: 180
    eventIntervalMax: 450
    chaosFactors:
    - !type:LivingPlayersFactor
      livingChaosChange: -0.012
    - !type:DeadPlayersFactor
      deadChaosChange: 0.048
    - !type:AntagObjectiveFactor
      interval: 30
      chaosRates: Standard
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: SecretPlusTable

- type: ambientObjectiveChaosRates
  id: Standard
  objectiveRates:
    blob: { chaos: 0.1, expectedTime: 1800, decayPeriod: 1800 }
    contract: { chaos: 0.01, expectedTime: 1800, decayPeriod: 600 }
    conversion: { chaos: 0.03, expectedTime: 1200, decayPeriod: 600 }
    kill: { chaos: 0.05, expectedTime: 1200, decayPeriod: 1200 }
    nuke: { chaos: 0.15, expectedTime: 2400, decayPeriod: 2400 }
    steal: { chaos: 0.025, expectedTime: 500, decayPeriod: 120 }
  presenceRates:
    chimera: { chaos: 0.0375 }
    conspirator: { chaos: 0.015 }
    wizard: { chaos: 0.1 }
    xenoborg: { chaos: 0.075 }
    xenomorph: { chaos: 0.075 }
    zombie: { chaos: 0.01 }
