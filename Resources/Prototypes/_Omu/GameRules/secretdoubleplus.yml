- type: entity
  id: SecretDoublePlusMid
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretDoublePlus
    minStartingChaos: 8
    maxStartingChaos: 16
    chaosChangeVariationMin: 0.65
    chaosChangeVariationMax: 1.3
    chaosMatchingPower: 4
    eventIntervalMin: 180
    eventIntervalMax: 450
    chaosFactors:
    - !type:LivingPlayersFactor
      livingChaosChange: -0.012
    - !type:DeadPlayersFactor
      deadChaosChange: 0.048
    - !type:AntagAmbientFactor
      interval: 30
      chaosRates: Standard
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: SecretPlusTable

- type: ambientAntagChaosRates
  id: Standard
  objectives:
    blob:
      components: [ BlobCaptureCondition ]
      chaos: 0.1
      expectedTime: 1800
      decayPeriod: 1800
    contract:
      components: [ MeetContractWeightCondition, SignContractCondition ]
      chaos: 0.01
      expectedTime: 1800
      decayPeriod: 600
    conversion:
      components: [ CosmicConversionCondition, CosmicTierCondition ]
      chaos: 0.03
      expectedTime: 1200
      decayPeriod: 600
    kill:
      components:
        - AbsorbCondition
        - AbsorbChangelingCondition
        - HereticSacrificeCondition
        - KillPersonCondition
        - StealDNACondition
        - SlaughterDevourCondition
        - SlaughterKillEveryoneCondition
        - TeachALessonCondition
      chaos: 0.05
      expectedTime: 1200
      decayPeriod: 1200
    nuke:
      components: [ DetonateNukeCondition ]
      chaos: 0.5
      expectedTime: 2400
      decayPeriod: 2400
    steal:
      components: [ StealCondition ]
      chaos: 0.025
      expectedTime: 1200
      decayPeriod: 600
  presence:
    chimera:
      antags: [ Chimera, LetoferolSleeper ]
      chaos: 0.375
    conspirator:
      antags: [ Conspirator ]
      chaos: 0.012
    wizard:
      antags: [ Wizard ]
      chaos: 0.1
    xenoborg:
      antags: [ Xenoborg ]
      chaos: 0.75
    xenomorph:
      antags: [ Xenomorph, XenomorphsInfestationRoundstart ]
      chaos: 0.75
    zombie:
      antags: [ Zombie, InitialInfected ]
      chaos: 0.1
